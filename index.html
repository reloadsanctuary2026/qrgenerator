<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Code Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1115;
    color: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
  }
  .card {
    background: #1a1d24;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  h1 { font-size: 18px; margin: 0 0 20px; color: #fff; }
  label.field-label {
    display: block;
    font-size: 12px;
    color: #999;
    margin-bottom: 4px;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #0f1115;
    color: #fff;
    font-size: 14px;
    margin-bottom: 12px;
  }
  select {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #0f1115;
    color: #fff;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .row-2 {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
  }
  .row-2 > div { flex: 1; }
  .color-field {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 6px 10px;
    background: #0f1115;
  }
  .color-field input[type="color"] {
    width: 28px;
    height: 28px;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
  }
  .color-field span { font-size: 12px; color: #ccc; }
  .logo-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    color: #ccc;
  }
  .logo-toggle input { width: 16px; height: 16px; }
  button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #4f8cff;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 8px;
  }
  button:hover { background: #3a75e8; }
  button.secondary { background: #2a2d36; }
  button.secondary:hover { background: #35383f; }
  #qrbox {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 20px 0;
    padding: 16px;
    background: #fff;
    border-radius: 12px;
    min-height: 200px;
  }
  #qrCanvas { border-radius: 4px; display: block; }
  .hint { font-size: 12px; color: #777; margin-top: -4px; margin-bottom: 16px; }
  #placeholder { color: #999; font-size: 13px; }
</style>
</head>
<body>
<div class="card">
  <h1>QR Code Generator</h1>

  <label class="field-label">Isi (link / text)</label>
  <input id="text" type="text" placeholder="Paste link atau text di sini..." />

  <div class="row-2">
    <div>
      <label class="field-label">Ukuran</label>
      <select id="size">
        <option value="200">Small (200px)</option>
        <option value="300" selected>Medium (300px)</option>
        <option value="500">Large (500px)</option>
      </select>
    </div>
    <div>
      <label class="field-label">Bentuk modul</label>
      <select id="shape">
        <option value="square" selected>Kotak</option>
        <option value="rounded">Rounded</option>
        <option value="dots">Dots (bulat)</option>
      </select>
    </div>
  </div>

  <div class="row-2">
    <div class="color-field">
      <input type="color" id="fgColor" value="#000000" />
      <span>Warna QR</span>
    </div>
    <div class="color-field">
      <input type="color" id="bgColor" value="#ffffff" />
      <span>Background</span>
    </div>
  </div>

  <label class="logo-toggle">
    <input type="checkbox" id="useLogo" checked />
    Sertakan logo Reload Kitchen di tengah
  </label>

  <button onclick="generate()">Generate QR</button>
  <button class="secondary" onclick="download()">Download PNG</button>
  <div class="hint">QR di-generate langsung di browser, tanpa kirim data ke server manapun.</div>

  <div id="qrbox">
    <span id="placeholder">QR bakal muncul di sini</span>
  </div>
</div>

const logoImg = new Image();
logoImg.src = LOGO_SRC;

function isFinderZone(row, col, moduleCount) {
  const topLeft = row < 7 && col < 7;
  const topRight = row < 7 && col >= moduleCount - 7;
  const bottomLeft = row >= moduleCount - 7 && col < 7;
  return topLeft || topRight || bottomLeft;
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawQR(canvas, text, size, shape, fgColor, bgColor, includeLogo) {
  const qr = qrcode(0, includeLogo ? 'H' : 'M');
  qr.addData(text);
  qr.make();

  const moduleCount = qr.getModuleCount();
  const cellSize = size / moduleCount;

  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // background
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, size, size);

  ctx.fillStyle = fgColor;

  for (let row = 0; row < moduleCount; row++) {
    for (let col = 0; col < moduleCount; col++) {
      if (!qr.isDark(row, col)) continue;
      const x = col * cellSize;
      const y = row * cellSize;

      // keep finder patterns as solid squares for reliable scanning
      const finder = isFinderZone(row, col, moduleCount);
      const effectiveShape = finder ? 'square' : shape;

      if (effectiveShape === 'square') {
        ctx.fillRect(x, y, cellSize, cellSize);
      } else if (effectiveShape === 'rounded') {
        roundRectPath(ctx, x, y, cellSize, cellSize, cellSize * 0.3);
        ctx.fill();
      } else if (effectiveShape === 'dots') {
        const r = cellSize * 0.45;
        ctx.beginPath();
        ctx.arc(x + cellSize / 2, y + cellSize / 2, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  if (includeLogo) {
    const aspect = logoImg.naturalWidth / logoImg.naturalHeight;
    const logoWidth = size * 0.4;
    const logoHeight = logoWidth / aspect;
    const pad = logoHeight * 0.35;
    const boxWidth = logoWidth + pad * 2;
    const boxHeight = logoHeight + pad * 2;
    const cx = (size - boxWidth) / 2;
    const cy = (size - boxHeight) / 2;

    ctx.fillStyle = bgColor;
    roundRectPath(ctx, cx, cy, boxWidth, boxHeight, 8);
    ctx.fill();

    ctx.drawImage(logoImg, cx + pad, cy + pad, logoWidth, logoHeight);
  }
}

function generate() {
  const text = document.getElementById('text').value.trim();
  const size = parseInt(document.getElementById('size').value);
  const shape = document.getElementById('shape').value;
  const fgColor = document.getElementById('fgColor').value;
  const bgColor = document.getElementById('bgColor').value;
  const useLogo = document.getElementById('useLogo').checked;
  const box = document.getElementById('qrbox');

  if (!text) {
    box.innerHTML = '<span style="color:#c00;font-size:13px;">Isi link/text dulu ya</span>';
    return;
  }

  function render() {
    box.innerHTML = '';
    const canvas = document.createElement('canvas');
    canvas.id = 'qrCanvas';
    box.appendChild(canvas);
    drawQR(canvas, text, size, shape, fgColor, bgColor, useLogo);
  }

  if (useLogo && !logoImg.complete) {
    logoImg.onload = render;
  } else {
    render();
  }
}

function download() {
  const canvas = document.getElementById('qrCanvas');
  if (!canvas) {
    alert('Generate QR dulu sebelum download.');
    return;
  }
  const link = document.createElement('a');
  link.download = 'qrcode.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

document.getElementById('text').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') generate();
});
</script>
</body>
</html>
