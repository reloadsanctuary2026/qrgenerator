<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1115;
    color: #eee;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px;
  }
  .card {
    background: #1a1d24;
    border-radius: 20px;
    padding: 28px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  h1 {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 20px;
    letter-spacing: 0.3px;
  }
  .field-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1.5px solid #2a2d36;
    background: #0f1115;
    color: #fff;
    font-size: 14px;
    margin-bottom: 14px;
    outline: none;
    transition: border-color .15s;
  }
  input[type="text"]:focus { border-color: #4f8cff; }
  .row-2 { display: flex; gap: 10px; margin-bottom: 14px; }
  .row-2 > div { flex: 1; }
  select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1.5px solid #2a2d36;
    background: #0f1115;
    color: #fff;
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }
  .color-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .color-field {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1.5px solid #2a2d36;
    border-radius: 10px;
    padding: 8px 12px;
    background: #0f1115;
    cursor: pointer;
  }
  .color-field input[type="color"] {
    width: 26px; height: 26px;
    border: none; background: none; padding: 0; cursor: pointer;
    border-radius: 6px;
  }
  .color-field span { font-size: 12px; color: #aaa; }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    cursor: pointer;
  }
  .toggle-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: #4f8cff; cursor: pointer; }
  .toggle-row span { font-size: 13px; color: #bbb; }

  .btn {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 8px;
    transition: background .15s, transform .1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: #4f8cff; color: #fff; }
  .btn-primary:hover { background: #3a78f2; }
  .btn-secondary { background: #23262f; color: #ccc; }
  .btn-secondary:hover { background: #2c303a; }

  /* QR preview area */
  #previewWrap {
    margin-top: 20px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  #previewWrap.visible { display: flex; }
  #qrCanvas {
    border-radius: 14px;
    display: block;
    max-width: 100%;
    height: auto;
    box-shadow: 0 4px 24px rgba(0,0,0,0.35);
  }
  .hint { font-size: 11px; color: #555; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>QR Code Generator</h1>

  <label class="field-label">Link / Text</label>
  <input id="text" type="text" placeholder="Paste link atau text di sini..." />

  <div class="row-2">
    <div>
      <label class="field-label">Ukuran output</label>
      <select id="size">
        <option value="300">300 px</option>
        <option value="500" selected>500 px</option>
        <option value="800">800 px</option>
      </select>
    </div>
    <div>
      <label class="field-label">Bentuk modul</label>
      <select id="shape">
        <option value="square" selected>Kotak</option>
        <option value="rounded">Rounded</option>
        <option value="dots">Dots</option>
      </select>
    </div>
  </div>

  <div class="color-row">
    <label class="color-field">
      <input type="color" id="fgColor" value="#000000" />
      <span>Warna QR</span>
    </label>
    <label class="color-field">
      <input type="color" id="bgColor" value="#ffffff" />
      <span>Background</span>
    </label>
  </div>

  <label class="toggle-row">
    <input type="checkbox" id="useLogo" checked />
    <span>Sertakan logo Reload Kitchen</span>
  </label>

  <button class="btn btn-primary" onclick="generate()">Generate QR</button>
  <button class="btn btn-secondary" onclick="download()">↓ Download PNG</button>

  <div id="previewWrap">
    <canvas id="qrCanvas"></canvas>
    <span class="hint">QR di-generate lokal — data tidak dikirim ke server manapun.</span>
  </div>
</div>

const logoImg = new Image();
logoImg.src = LOGO_SRC;

function isFinderZone(r, c, mc) {
  return (r < 7 && c < 7) || (r < 7 && c >= mc-7) || (r >= mc-7 && c < 7);
}
function rrPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawQR(canvas, text, size, shape, fg, bg, withLogo) {
  const qr = qrcode(0, 'H'); // always H — max error correction for reliability
  qr.addData(text);
  qr.make();
  const mc = qr.getModuleCount();
  const qz = 1;
  const total = mc + qz * 2;
  const cell = size / total;
  const off = qz * cell;

  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = fg;

  for (let row = 0; row < mc; row++) {
    for (let col = 0; col < mc; col++) {
      if (!qr.isDark(row, col)) continue;
      const x = off + col * cell;
      const y = off + row * cell;
      const eff = isFinderZone(row, col, mc) ? 'square' : shape;
      if (eff === 'square') {
        ctx.fillRect(x, y, cell, cell);
      } else if (eff === 'rounded') {
        rrPath(ctx, x, y, cell, cell, cell * 0.3);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(x + cell/2, y + cell/2, cell * 0.45, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }

  if (withLogo) {
    const asp = logoImg.naturalWidth / logoImg.naturalHeight;
    const lw = size * 0.28;
    const lh = lw / asp;
    const pad = lh * 0.35;
    const bw = lw + pad*2, bh = lh + pad*2;
    const cx = (size - bw)/2, cy = (size - bh)/2;
    ctx.fillStyle = bg;
    rrPath(ctx, cx, cy, bw, bh, 8);
    ctx.fill();
    ctx.drawImage(logoImg, cx+pad, cy+pad, lw, lh);
  }
}

function generate() {
  const text = document.getElementById('text').value.trim();
  if (!text) {
    document.getElementById('text').focus();
    document.getElementById('text').style.borderColor = '#e55';
    setTimeout(() => document.getElementById('text').style.borderColor = '', 1000);
    return;
  }
  const size    = parseInt(document.getElementById('size').value);
  const shape   = document.getElementById('shape').value;
  const fg      = document.getElementById('fgColor').value;
  const bg      = document.getElementById('bgColor').value;
  const withLogo = document.getElementById('useLogo').checked;
  const canvas  = document.getElementById('qrCanvas');
  const wrap    = document.getElementById('previewWrap');

  function render() {
    drawQR(canvas, text, size, shape, fg, bg, withLogo);
    wrap.classList.add('visible');
    canvas.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  if (withLogo && !logoImg.complete) { logoImg.onload = render; }
  else { render(); }
}

function download() {
  const canvas = document.getElementById('qrCanvas');
  if (!canvas.width) { alert('Generate QR dulu.'); return; }
  const a = document.createElement('a');
  a.download = 'qrcode-reload-kitchen.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}

document.getElementById('text').addEventListener('keydown', e => {
  if (e.key === 'Enter') generate();
});
